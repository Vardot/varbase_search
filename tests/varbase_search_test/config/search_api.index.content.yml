langcode: en
status: true
dependencies:
  config:
    - core.entity_view_mode.node.full
    - search_api.server.database_server
  module:
    - node
id: content
name: Content
description: null
read_only: false
field_settings:
  rendered_item:
    label: 'Rendered HTML output'
    property_path: rendered_item
    type: text
    configuration:
      roles:
        - anonymous
      view_mode:
        'entity:node':
          article: full
          page: full
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: 2.0
    dependencies:
      module:
        - node
datasource_settings:
  'entity:node':
    bundles:
      default: true
      selected: {  }
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  aggregated_field: {  }
  custom_value: {  }
  entity_type: {  }
  html_filter:
    all_fields: true
    fields:
      - rendered_item
      - title
    title: true
    alt: true
    tags:
      b: 2.0
      em: 1.5
      h1: 5.0
      h2: 3.0
      h3: 2.0
      strong: 2.0
      u: 1.5
  ignorecase:
    all_fields: true
    fields:
      - rendered_item
      - title
  language_with_fallback: {  }
  rendered_item: {  }
  tokenizer:
    all_fields: true
    fields:
      - rendered_item
      - title
    spaces: ''
    ignored: ._-
    overlap_cjk: 1
    minimum_word_size: '3'
tracker_settings:
  default:
    indexing_order: fifo
options:
  cron_limit: 50
  delete_on_fail: true
  index_directly: true
  track_changes_in_references: true
server: database_server
